  <g stroke="#22d3ee" stroke-width="2" opacity="0.9" fill="none">
    <path d="M28 24 V44 M28 24 H48"/>
    <path d="M1172 24 V44 M1172 24 H1152"/>
    <path d="M28 276 V256 M28 276 H48"/>
    <path d="M1172 276 V256 M1172 276 H1152"/>
