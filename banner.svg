<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="hexgrid" width="42" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <path d="M10.5 0 L21 6 L21 18 L10.5 24 L0 18 L0 6 Z" fill="none" stroke="#1b2838" stroke-width="1"/>
      <path d="M31.5 0 L42 6 L42 18 L31.5 24 L21 18 L21 6 Z" fill="none" stroke="#1b2838" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05070b" stop-opacity="1"/>
      <stop offset="18%" stop-color="#05070b" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#05070b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="#05070b"/>
  <rect width="1200" height="300" fill="url(#hexgrid)"/>
  <rect width="1200" height="300" fill="url(#fade)"/>

  <g opacity="0.55" stroke="#22d3ee" stroke-width="1.2" fill="none">
    <path d="M0 40 H160 L185 65 H420"/>
    <path d="M0 255 H120 L145 230 H300 L325 255 H520"/>
    <path d="M1200 30 H1010 L985 55 H760"/>
    <path d="M1200 270 H1080 L1055 245 H880 L855 270 H700"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="420" cy="65" r="3.2"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="185" cy="65" r="2.4"/>
    <circle cx="520" cy="255" r="3.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="55" r="2.4"/>
    <circle cx="700" cy="270" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="60" y="235" font-family="'Fira Code','Courier New',monospace" font-size="15" fill="#3ddc84">
    guest<tspan fill="#5c6773">@</tspan>scriptkiddiee0<tspan fill="#5c6773">:~$</tspan><tspan fill="#e5e7eb" dx="8">whoami --grow</tspan>
    <tspan fill="#3ddc84">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </tspan><tspan fill="#3ddc84" dx="2">▍</tspan>
  </text>

  <text x="60" y="140" font-family="'Fira Code','Courier New',monospace" font-size="58" font-weight="700" fill="#0a0e14" opacity="0.5" transform="translate(-2,3)">scriptkiddiee0</text>
  <text x="60" y="140" font-family="'Fira Code','Courier New',monospace" font-size="58" font-weight="700" fill="url(#titleGrad)" filter="url(#softGlow)">scriptkiddiee0</text>

  <text x="62" y="178" font-family="'Fira Code','Courier New',monospace" font-size="17" fill="#8b98a9" letter-spacing="2">
